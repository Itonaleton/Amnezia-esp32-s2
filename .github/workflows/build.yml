name: Build ESP32-S2 firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build
        run: pio run -e esp32-s2

      - name: Verify AWG commands in binary
        run: |
          strings .pio/build/esp32-s2/firmware.bin | grep -E "awg_up|awg_param"

      - name: Merge binaries for 0x0 offset
        run: |
          esptool.py --chip esp32s2 merge_bin \
            -o .pio/build/esp32-s2/esp32s2_full_0x0.bin \
            --flash_mode dio --flash_freq 80m --flash_size 2MB \
            0x1000 .pio/build/esp32-s2/bootloader.bin \
            0x8000 .pio/build/esp32-s2/partitions.bin \
            0x10000 .pio/build/esp32-s2/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s2
          path: |
            .pio/build/esp32-s2/esp32s2_full_0x0.bin
            .pio/build/esp32-s2/bootloader.bin
            .pio/build/esp32-s2/partitions.bin
            .pio/build/esp32-s2/firmware.bin
